[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hidl"
version = "0.2.0"
description = "HIDL — compilador de contratos CPU–FPGA com back-ends C++ e Verilog"
requires-python = ">=3.10"

[project.scripts]
hidl = "hidl.cli:main"
hidl-v2 = "hidl_v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
